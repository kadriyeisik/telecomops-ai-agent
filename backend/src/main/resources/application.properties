spring.application.name=pia-ai-agent

# ---- LLM Provider ----
# Which provider AgentService talks to. Options: openai | ollama
llm.provider=openai

# ---- OpenAI Settings (used when llm.provider=openai) ----
# Set your key as an environment variable — NEVER hardcode it here:
#   Windows : set OPENAI_API_KEY=sk-...
#   macOS / Linux: export OPENAI_API_KEY=sk-...
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# ---- Ollama Settings (used when llm.provider=ollama) ----
# Requires Ollama running locally (ollama serve) with a tool-calling-capable
# model pulled, e.g.: ollama pull llama3.1
ollama.api.url=http://localhost:11434/api/chat
ollama.model=llama3.1

# ---- H2 In-memory Database (conversation history) ----
spring.datasource.url=jdbc:h2:mem:agentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
